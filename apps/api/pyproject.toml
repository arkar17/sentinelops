[project]
name = "sentinelops"
version = "0.1.0"
description = "SentinelOps: multi-tenant API monitoring and incident management (API, worker, notifier, CLI)."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "cryptography>=45",
    "dnspython>=2.7",
    "fastapi>=0.120",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
sentinelops = "sentinelops.cli.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.3",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelops"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "N", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S106"]
# DDL built from module constants (role and table names), never from input.
"migrations/**" = ["S608"]

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "."]
executionEnvironments = [
    # Starlette's TestClient is partially untyped; src/ stays fully strict.
    { root = "tests", reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false },
    { root = "migrations", reportUnknownMemberType = false },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires the disposable sentinelops_test database",
    "performance: long-running NFR-003 load test; runs only with SENTINELOPS_LOAD_TEST=1",
]

[tool.importlinter]
root_package = "sentinelops"

[[tool.importlinter.contracts]]
name = "Platform plane must not access organization secrets (ADR-005)"
type = "forbidden"
source_modules = ["sentinelops.platform"]
forbidden_modules = ["sentinelops.secrets"]

[[tool.importlinter.contracts]]
name = "Domain modules do not depend on process entrypoints"
type = "forbidden"
source_modules = [
    "sentinelops.identity",
    "sentinelops.platform",
    "sentinelops.tenancy",
    "sentinelops.authz",
    "sentinelops.catalog",
    "sentinelops.secrets",
    "sentinelops.probe_policy",
    "sentinelops.probes",
    "sentinelops.scheduler",
    "sentinelops.measurements",
    "sentinelops.incidents",
    "sentinelops.notifications",
    "sentinelops.status_pages",
    "sentinelops.realtime",
    "sentinelops.audit",
]
forbidden_modules = [
    "sentinelops.api",
    "sentinelops.worker",
    "sentinelops.notifier",
    "sentinelops.cli",
]
